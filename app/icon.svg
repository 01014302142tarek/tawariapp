<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#1C1405" />
      <stop offset="100%" stopColor="#0A0A0A" />
    </radialGradient>
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F59E0B" />
      <stop offset="50%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#B45309" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" floodColor="#F59E0B" floodOpacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#2A2A2A" stroke-width="4" />

  <!-- Outer subtle gold ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldLinear)" stroke-width="1.5" opacity="0.25" stroke-dasharray="8 8" />

  <!-- Logo Graphics scaled to 512 (viewBox 100 100 -> centered in 512) -->
  <g transform="translate(68, 55) scale(3.76)" filter="url(#goldGlow)">
    <!-- Stethoscope top arc -->
    <path
      d="M28 18 C28 18 22 18 22 28 L22 50 C22 65 35 75 50 75 C65 75 78 65 78 50 L78 28 C78 18 72 18 72 18"
      fill="none"
      stroke="url(#goldLinear)"
      stroke-width="5.5"
      stroke-linecap="round"
    />
    <!-- Left earpiece -->
    <circle cx="28" cy="16" r="5" fill="url(#goldLinear)" />
    <!-- Right earpiece -->
    <circle cx="72" cy="16" r="5" fill="url(#goldLinear)" />
    <!-- Chest piece circle -->
    <circle cx="50" cy="82" r="9" fill="none" stroke="url(#goldLinear)" stroke-width="4.5" />
    <!-- Heart inside chest piece -->
    <path
      d="M50 88 C50 88 42 80 42 75 C42 71 45 69 47.5 69 C49 69 50 70.5 50 70.5 C50 70.5 51 69 52.5 69 C55 69 58 71 58 75 C58 80 50 88 50 88Z"
      fill="url(#goldLinear)"
    />
  </g>
</svg>