name: Security Scan

on:
  pull_request:
  push:
    branches: [main, staging]
  schedule:
    - cron: "0 4 * * 1" # weekly Monday 04:00 UTC

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-semgrep
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep --config p/ci \
                  --config p/javascript \
                  --config p/typescript \
                  --config p/nextjs \
                  --config p/react \
                  --config p/secrets \
                  --severity ERROR \
                  --exclude="stitch_tawariapp_landing_page" \
                  --exclude="scripts" \
                  --exclude="lib/supabase/mock.ts" \
                  --metrics=auto
